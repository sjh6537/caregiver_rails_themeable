---
include:
- "**/*.rb"
exclude:
- spec/**/*
- test/**/*
- vendor/**/*
- ".bundle/**/*"
require: []
domains: []
reporters:
- rubocop
- require_not_found
formatter:
  rubocop:
    cops: safe
    except:
    - Layout/IndentationWidth
    only: []
    extra_args: []
require_paths: []
plugins:
- solargraph-rails
- rubocop
max_files: 5000
