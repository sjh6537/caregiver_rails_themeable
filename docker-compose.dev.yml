services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -lc "bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: sa
      DB_PASSWORD: taiwan
      DB_DEVELOPMENT_DATABASE: padifield_development
      REDIS_URL: redis://redis:6379/1
      BUNDLE_WITHOUT: ""
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    tty: true
    stdin_open: true

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -lc "bundle exec sidekiq -C config/sidekiq.yml"
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: sa
      DB_PASSWORD: taiwan
      DB_DEVELOPMENT_DATABASE: padifield_development
      REDIS_URL: redis://redis:6379/1
      BUNDLE_WITHOUT: ""
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: padifield_development
      MYSQL_USER: sa
      MYSQL_PASSWORD: taiwan
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  bundle:
  mysql_data:
