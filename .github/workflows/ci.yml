name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  rails:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: caregiver_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      REDIS_URL: redis://127.0.0.1:6379/1
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_TEST_DATABASE: caregiver_test
      BUNDLE_WITHOUT: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:create db:migrate

      - name: Zeitwerk check
        run: bin/rails zeitwerk:check

      - name: Verify test files exist
        run: |
          shopt -s globstar nullglob
          test_files=(test/**/*_test.rb)
          if [ ${#test_files[@]} -eq 0 ]; then
            echo "::error::No *_test.rb files found under test/. Add tests before merging."
            exit 1
          fi

      - name: Run test suite
        run: bin/rails test
